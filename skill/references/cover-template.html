<!doctype html>
<!--
  小红书封面模板(3:4 1080×1440)· 天青色宋瓷风(用户固定偏好)
  规范:
    1. #hook 钩子文字(≤14字断两行)、#sub 副标题
    2. 左上角 #user-id:用户自己的小红书 ID(流程开始时向用户索取,如 @xxx)
    3. 右下角 #tags:话题标签由 AI 根据帖子内容自动生成 3-5 个(主题+关键词+人群),每帖按内容定
    4. 配色 :root(天青系:月白底 #F6F4EF / 天青 #7FA8B5 / 深青 #2E5563 / 茶褐点缀)
    5. 意象:器物剪影/圆点阵/开片线(替换 #vase 形状可换器物)
    6. headless Chrome 导出 2x PNG:
       "$CHROME" --headless=new --screenshot=cover.png --window-size=1080,1440 \
         --force-device-scale-factor=2 --hide-scrollbars file://$PWD/cover.html
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>小红书封面 · 天青</title>
<style>
  :root { --bg:#f6f4ef; --ink:#33302b; --accent:#7fa8b5; --accent-deep:#2e5563; --dot:#9c6b4e; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1080px; height:1440px; overflow:hidden;
    font-family:"PingFang SC","Songti SC",serif; background:var(--bg); color:var(--ink);
  }
  #stage {
    position:relative; width:1080px; height:1440px; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(120% 100% at 50% -5%, rgba(127,168,181,.16) 0%, rgba(127,168,181,0) 55%), var(--bg);
  }
  /* 左上角 ID(用户自己的小红书 ID) */
  #user-id {
    position:absolute; top:64px; left:72px; z-index:3;
    font-size:30px; font-weight:600; color:var(--accent-deep); letter-spacing:.04em;
    font-family:"Songti SC",serif;
  }
  /* 右下角话题标签(AI 按帖子内容生成 3-5 个,勿套用固定标签) */
  #tags {
    position:absolute; bottom:56px; right:72px; z-index:3;
    font-size:26px; color:var(--accent-deep); letter-spacing:.02em;
    text-align:right; line-height:1.6;
  }
  /* 意象:器物剪影 */
  #vase { position:absolute; top:150px; left:50%; transform:translateX(-50%); opacity:.92; }
  /* 意象:开片细线 */
  #crackle { position:absolute; right:0; bottom:0; opacity:.3; }
  /* 意象:圆点阵 */
  .dots .dot { position:absolute; width:6px; height:6px; border-radius:50%; background:var(--dot); opacity:.5; }
  /* 文字区:钩子最大,一眼读完 */
  #text { position:relative; z-index:2; text-align:center; margin-top:430px; }
  #hook { font-size:88px; font-weight:800; line-height:1.3; letter-spacing:.02em; }
  #sub { margin-top:36px; font-size:30px; color:var(--accent); letter-spacing:.14em; }
</style>
</head>
<body>
<div id="stage">
  <span id="user-id">@你的小红书ID</span>
  <div class="dots">
    <span class="dot" style="left:110px;top:220px"></span>
    <span class="dot" style="left:210px;top:330px;width:9px;height:9px"></span>
    <span class="dot" style="left:860px;top:200px;width:8px;height:8px"></span>
    <span class="dot" style="left:930px;top:360px"></span>
    <span class="dot" style="left:140px;top:1180px;width:8px;height:8px"></span>
    <span class="dot" style="left:890px;top:1220px"></span>
  </div>
  <svg id="crackle" width="420" height="250" viewBox="0 0 260 160" fill="none">
    <path d="M0 20 L80 60 L40 120 L160 150 L220 90 L260 110" stroke="#9c6b4e" stroke-width="1"/>
    <path d="M80 60 L140 30 L180 70" stroke="#7fa8b5" stroke-width="1"/>
    <path d="M40 120 L10 140 L30 160" stroke="#9c6b4e" stroke-width="1"/>
  </svg>
  <svg id="vase" width="280" height="410" viewBox="0 0 200 300">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#6E9CA5"/><stop offset="50%" stop-color="#8FB3BC"/><stop offset="100%" stop-color="#5E8A94"/>
      </linearGradient>
    </defs>
    <path d="M100 18 C 95 18, 88 30, 86 46 C 84 72, 60 96, 55 142 C 50 184, 60 244, 70 266 C 75 280, 82 288, 90 291 L 110 291 C 118 288, 125 280, 130 266 C 140 244, 150 184, 145 142 C 140 96, 116 72, 114 46 C 112 30, 105 18, 100 18 Z" fill="url(#g)"/>
    <path d="M97 60 C 94 90, 84 120, 78 160" stroke="rgba(255,255,255,.3)" stroke-width="2" fill="none" stroke-linecap="round"/>
  </svg>
  <div id="text">
    <!-- 钩子文字:最大、一眼读完;每帖按内容改 -->
    <div id="hook">懂宋瓷的人,<br/>从不着急</div>
    <div id="sub">宋瓷 Skill × 会变色的封面模板</div>
  </div>
  <!-- 话题标签:AI 根据帖子内容自动生成 3-5 个(主题+关键词+人群),每帖按内容改 -->
  <span id="tags">#文章一键成片 #天青 #宋瓷</span>
</div>
</body>
</html>
